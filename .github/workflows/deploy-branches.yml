name: Deploy Multiple Branches

on:
  push:
    branches:
      - main
      - old
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main

      - name: Checkout old branch
        uses: actions/checkout@v3
        with:
          ref: old
          path: old

      - name: Checkout dev branch
        uses: actions/checkout@v3
        with:
          ref: dev
          path: dev

      - name: Setup deployment structure
        run: |
          mkdir -p deploy
          cp -r main/* deploy/
          mkdir -p deploy/old
          cp -r old/* deploy/old/
          mkdir -p deploy/dev
          cp -r dev/* deploy/dev/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
