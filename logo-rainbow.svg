<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <!-- T - Red background (#FF0000, hue 0°), Cyan text (#00FFFF, hue 180°) -->
  <rect x="0" y="0" width="100" height="100" fill="#FF0000"/>
  <text x="50" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#00FFFF" text-anchor="middle" dominant-baseline="central">T</text>
  
  <!-- A - Orange background (#FF8800, hue 33°), Blue text (#0077FF, hue 213°) -->
  <rect x="100" y="0" width="100" height="100" fill="#FF8800"/>
  <text x="150" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#0077FF" text-anchor="middle" dominant-baseline="central">A</text>
  
  <!-- T - Yellow background (#FFDD00, hue 52°), Blue text (#0022FF, hue 232°) -->
  <rect x="200" y="0" width="100" height="100" fill="#FFDD00"/>
  <text x="250" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#0022FF" text-anchor="middle" dominant-baseline="central">T</text>
  
  <!-- L - Green background (#00CC00, hue 120°), Magenta text (#CC00CC, hue 300°) -->
  <rect x="300" y="0" width="100" height="100" fill="#00CC00"/>
  <text x="350" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#CC00CC" text-anchor="middle" dominant-baseline="central">L</text>
  
  <!-- O - Blue background (#0088FF, hue 207°), Orange text (#FF7700, hue 27°) -->
  <rect x="400" y="0" width="100" height="100" fill="#0088FF"/>
  <text x="450" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#FF7700" text-anchor="middle" dominant-baseline="central">O</text>
  
  <!-- ! - Purple background (#8800FF, hue 273°), Yellow-Green text (#77FF00, hue 93°) -->
  <rect x="500" y="0" width="100" height="100" fill="#8800FF"/>
  <text x="550" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#77FF00" text-anchor="middle" dominant-baseline="central">!</text>
</svg>
