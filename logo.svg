<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <!-- T - White background, Black text -->
  <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
  <text x="50" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="central">T</text>
  
  <!-- A - Black background, White text -->
  <rect x="100" y="0" width="100" height="100" fill="#000000"/>
  <text x="150" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">A</text>
  
  <!-- T - White background, Black text -->
  <rect x="200" y="0" width="100" height="100" fill="#ffffff"/>
  <text x="250" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="central">T</text>
  
  <!-- L - Black background, White text -->
  <rect x="300" y="0" width="100" height="100" fill="#000000"/>
  <text x="350" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">L</text>
  
  <!-- O - White background, Black text -->
  <rect x="400" y="0" width="100" height="100" fill="#ffffff"/>
  <text x="450" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="central">O</text>
  
  <!-- ! - Black background, White text -->
  <rect x="500" y="0" width="100" height="100" fill="#000000"/>
  <text x="550" y="50" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">!</text>
</svg>
